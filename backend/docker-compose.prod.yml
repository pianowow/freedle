services:
  freedle-backend:
    container_name: freedle-backend
    build:
      context: ..
      dockerfile: backend/Dockerfile

    env_file:
      - .backend.env
    # No public port needed; cloudflared reaches this via Docker network
    expose:
      - "8000"
    volumes:
      - ./logs:/data
      - ./src:/app/src
    restart: unless-stopped
    networks:
      - default
      - proxy_default

  # Private admin service (do NOT connect to cloudflared).
  freedle-admin:
    container_name: freedle-admin
    build:
      context: ..
      dockerfile: backend/Dockerfile

    env_file:
      - .backend.env
    command: ["node", "--watch", "src/admin.js"]
    expose:
      - "8001"
    environment:
      - ADMIN_PORT=8001
    volumes:
      - ./logs:/data:ro
      - ./src:/app/src
    restart: unless-stopped
    networks:
      - proxy_default

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: freedle-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - freedle-backend
    restart: unless-stopped

networks:
  proxy_default:
    external: true
