services:
  freedle-backend:
    container_name: freedle-backend
    build:
      context: .
    env_file:
      - .backend.env
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/data
      - ./src:/app/src
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
