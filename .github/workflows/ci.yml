# .github/workflows/ci.yml
name: Build, Test, and Sometimes Deploy

on:
  push:
    paths:
      - "frontend/**"
      - ".gitattributes"
      - ".github/workflows/ci.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Or any other LTS version

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Report lint failure
        if: steps.lint.outcome == 'failure'
        run: |
          echo "::warning::Frontend lint failed, but CI is continuing so tests and deploy can proceed."
          echo "## Frontend lint failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Lint issues did not block this run. Check the **Run lint** step logs for details." >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Upload dist artifact
        # This conditional ensures only the main branch builds are saved for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: "./frontend/dist"

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-build
    # Strict conditional to ensure deployment ONLY happens on pushes to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: frontend

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: "./frontend/dist"

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./frontend/dist" # The directory containing your build output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
