name: Build and Test

on:
  # pull_request CI is intentionally disabled for now. This keeps Actions usage
  # focused on branch pushes until the project is ready for PR validation.
  push:
    paths:
      - "frontend/**"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-pages.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Report lint failure
        if: steps.lint.outcome == 'failure'
        run: |
          echo "::warning::Frontend lint failed, but CI is continuing so tests and build can proceed."
          echo "## Frontend lint failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Lint issues did not block this run. Check the **Run lint** step logs for details." >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
